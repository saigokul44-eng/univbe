{% extends "base.html" %}
{% block title %}Login — UniVibe{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-bg-blob"></div>
  <div class="container">
    <div class="row justify-content-center min-vh-80 align-items-center py-5">
      <div class="col-md-5">
        <div class="uv-card auth-card">
          <div class="text-center mb-4">
            <span class="brand-logo lg">UV</span>
            <h2 class="mt-3 auth-title">Welcome Back!</h2>
            <p class="text-muted">Login to see your vibe matches</p>
          </div>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label uv-label">Username or Email</label>
              <div class="input-group uv-input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="identifier" class="form-control uv-input" placeholder="johndoe or john@uni.com" required/>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label uv-label">Password</label>
              <div class="input-group uv-input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control uv-input" placeholder="••••••••" required/>
              </div>
            </div>
            <button type="submit" class="btn uv-btn-primary w-100 btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
          </form>
          <hr class="my-4"/>
          <p class="text-center mb-0">New to UniVibe? <a href="{{ url_for('register') }}" class="uv-link">Create an account →</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
